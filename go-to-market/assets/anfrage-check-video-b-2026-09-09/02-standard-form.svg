<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#fffaf2"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#08213b" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="74" width="68" height="68" rx="21" fill="#087eaa"/><text x="104" y="121" font-size="35" font-weight="700" text-anchor="middle" fill="white">Z</text>
    <text x="164" y="120" font-size="34" font-weight="700" fill="#08213b">ZunftEcho</text>
    <text x="70" y="255" font-size="31" font-weight="700" letter-spacing="3" fill="#087eaa">TYPISCHES KONTAKTFORMULAR</text>
    <rect x="70" y="320" width="940" height="1030" rx="42" fill="white" stroke="#dbe5ec" filter="url(#shadow)"/>
    <text x="130" y="425" font-size="50" font-weight="700" fill="#08213b">Ihre Nachricht</text>
    <text x="130" y="500" font-size="25" font-weight="700" fill="#607286">NAME</text><rect x="130" y="530" width="820" height="112" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="130" y="705" font-size="25" font-weight="700" fill="#607286">E-MAIL</text><rect x="130" y="735" width="820" height="112" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="130" y="910" font-size="25" font-weight="700" fill="#607286">NACHRICHT</text><rect x="130" y="940" width="820" height="230" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="130" y="1210" width="310" height="82" rx="18" fill="#087eaa"/><text x="285" y="1263" font-size="30" font-weight="700" text-anchor="middle" fill="white">Absenden</text>
    <text x="70" y="1450" font-size="38" font-weight="700" fill="#08213b">Und was fehlt für die Einsatzplanung?</text>
    <g font-size="31" font-weight="700">
      <rect x="70" y="1510" width="214" height="76" rx="38" fill="#fff1d6" stroke="#f59e0b"/><text x="177" y="1558" text-anchor="middle" fill="#9a5700">Einsatzort?</text>
      <rect x="306" y="1510" width="230" height="76" rx="38" fill="#fff1d6" stroke="#f59e0b"/><text x="421" y="1558" text-anchor="middle" fill="#9a5700">Dringlichkeit?</text>
      <rect x="558" y="1510" width="248" height="76" rx="38" fill="#fff1d6" stroke="#f59e0b"/><text x="682" y="1558" text-anchor="middle" fill="#9a5700">Erreichbarkeit?</text>
      <rect x="828" y="1510" width="182" height="76" rx="38" fill="#fff1d6" stroke="#f59e0b"/><text x="919" y="1558" text-anchor="middle" fill="#9a5700">Termin?</text>
    </g>
    <text x="70" y="1735" font-size="38" fill="#41566b"><tspan x="70">Nicht mehr Felder lösen das Problem.</tspan><tspan x="70" dy="56">Ein klarer Ablauf tut es.</tspan></text>
  </g>
</svg>
