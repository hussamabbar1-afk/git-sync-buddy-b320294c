<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff5e8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06233b"/>
      <stop offset="1" stop-color="#0b5272"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#08213b" flood-opacity=".12"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#087eaa" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1460" cy="60" r="240" fill="#38bdf8" opacity=".08"/>
  <circle cx="100" cy="870" r="210" fill="#f2a34c" opacity=".07"/>

  <g transform="translate(90 70)">
    <image href="../../../public/zunftecho-mark.png" x="0" y="0" width="116" height="116"/>
    <text x="142" y="54" font-family="Space Grotesk, Arial, sans-serif" font-size="48" font-weight="700" fill="#08213b">ZunftEcho</text>
    <text x="144" y="91" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#607286">FÜR SHK-BETRIEBE</text>
    <text x="0" y="166" font-family="DM Sans, Arial, sans-serif" font-size="20" fill="#607286">Visual Identity Lock · September 2026</text>
  </g>

  <g transform="translate(90 300)" font-family="DM Sans, Arial, sans-serif">
    <text x="0" y="0" font-size="18" font-weight="700" letter-spacing="3" fill="#087eaa">FARBSYSTEM</text>
    <g transform="translate(0 38)">
      <rect width="170" height="116" rx="22" fill="#06233b"/><text x="18" y="146" font-size="18" fill="#08213b">#06233B</text>
      <g transform="translate(192 0)"><rect width="170" height="116" rx="22" fill="#087eaa"/><text x="18" y="146" font-size="18" fill="#08213b">#087EAA</text></g>
      <g transform="translate(384 0)"><rect width="170" height="116" rx="22" fill="#38bdf8"/><text x="18" y="146" font-size="18" fill="#08213b">#38BDF8</text></g>
      <g transform="translate(576 0)"><rect width="170" height="116" rx="22" fill="#f2a34c"/><text x="18" y="146" font-size="18" fill="#08213b">#F2A34C</text></g>
      <g transform="translate(768 0)"><rect width="170" height="116" rx="22" fill="#22c55e"/><text x="18" y="146" font-size="18" fill="#08213b">#22C55E</text></g>
    </g>
  </g>

  <g transform="translate(90 570)" font-family="DM Sans, Arial, sans-serif">
    <text x="0" y="0" font-size="18" font-weight="700" letter-spacing="3" fill="#087eaa">TYPOGRAFIE</text>
    <text x="0" y="76" font-family="Space Grotesk, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Space Grotesk</text>
    <text x="0" y="118" font-size="22" fill="#607286">Überschriften · 600–700 · kompakt und klar</text>
    <text x="0" y="188" font-size="38" font-weight="500" fill="#08213b">DM Sans für ruhige, lesbare Oberflächen.</text>
    <text x="0" y="228" font-size="20" fill="#607286">Fließtext und UI · 400–600 · hohe Lesbarkeit</text>
  </g>

  <g transform="translate(1090 250)" filter="url(#shadow)">
    <rect width="410" height="500" rx="34" fill="#ffffff" fill-opacity=".78" stroke="#d8e2ea" stroke-width="2"/>
    <rect x="34" y="34" width="342" height="76" rx="20" fill="#ffffff" stroke="#d8e2ea"/>
    <circle cx="74" cy="72" r="16" fill="#087eaa"/>
    <rect x="106" y="58" width="150" height="12" rx="6" fill="#08213b" opacity=".2"/>
    <rect x="106" y="80" width="102" height="8" rx="4" fill="#607286" opacity=".18"/>
    <g fill="#f7fbff" stroke="#d8e2ea">
      <rect x="34" y="140" width="156" height="126" rx="24"/>
      <rect x="220" y="140" width="156" height="126" rx="24"/>
    </g>
    <path d="M190 203h30" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 10"/>
    <rect x="34" y="296" width="342" height="150" rx="26" fill="url(#navy)"/>
    <g fill="#ffffff" fill-opacity=".12" stroke="#7dd3fc" stroke-opacity=".35">
      <rect x="58" y="326" width="84" height="90" rx="18"/>
      <rect x="163" y="326" width="84" height="90" rx="18"/>
      <rect x="268" y="326" width="84" height="90" rx="18"/>
    </g>
    <circle cx="350" cy="470" r="8" fill="#22c55e"/>
  </g>

  <g transform="translate(1090 790)" font-family="DM Sans, Arial, sans-serif">
    <text font-size="18" font-weight="700" letter-spacing="3" fill="#087eaa">MOTION</text>
    <text y="38" font-size="19" fill="#607286">Ruhig · präzise · nachvollziehbar</text>
  </g>
</svg>
