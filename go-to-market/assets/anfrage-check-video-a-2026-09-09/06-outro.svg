      <text x="102" y="52" font-size="36" font-weight="700">ZunftEcho</text>
    </g>
    <text x="84" y="650" font-size="30" font-weight="700" letter-spacing="4" fill="#d57a12">DIREKT AUSPROBIEREN</text>
